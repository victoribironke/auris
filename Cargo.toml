[package]
name = "auris"
version = "0.2.0"
edition = "2021"
description = "A fast, keyboard-first launcher for Windows"
license = "MIT"
build = "build.rs"

[dependencies]
slint = "1.13"
fuzzy-matcher = "0.3"
global-hotkey = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.13"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
